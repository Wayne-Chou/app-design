<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>建豐AI - 動態骨架防跌檢測</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-teal: #0d9488;
        --primary-active: #0f766e;
        --text-dark: #0f172a;
        --text-gray: #64748b;
        --border-color: #cbd5e1;
        --input-focus: rgba(13, 148, 136, 0.1);
        --container-bg: rgba(255, 255, 255, 0.92);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        /* 強制移除圓角以符合俐落設計 */
        border-radius: 0 !important;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        /* 背景圖設定 */
        background-image: url("/img/bac.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }

      .main-container {
        width: 90%;
        max-width: 400px;
        background: #fff;
        padding: 50px 35px;
        border: none;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        outline: 1px solid rgba(255, 255, 255, 0.5);
        transition: font-size 0.2s ease; /* 讓字體切換時平滑一點 */
      }

      /* 控制項容器 (語系與字體) */
      .controls-wrapper {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-bottom: 20px;
      }

      .select-style {
        border: 1px solid var(--border-color);
        background: #fff;
        padding: 6px 10px;
        font-size: 13px;
        color: var(--text-gray);
        outline: none;
      }

      /* Logo 與 標題 */
      .logo-box {
        text-align: center;
        margin-bottom: 12px;
      }

      .logo-box img {
        width: 170px;
        height: auto;
      }

      .title-box {
        text-align: center;
        margin-bottom: 40px;
      }

      .title-box h1 {
        font-size: 1.3em; /* 改用 em 以跟隨父層縮放 */
        font-weight: 800;
        letter-spacing: 1.5px;
        color: var(--text-dark);
        margin: 0;
      }

      /* 表單組件 */
      .form-group {
        margin-bottom: 25px;
      }

      .form-group label {
        font-size: 0.85em;
        font-weight: 700;
        color: var(--primary-teal);
        margin-bottom: 10px;
        display: block;
      }

      .input-control {
        width: 100%;
        height: 52px;
        border: none;
        border: 2px solid #e2e8f0;
        padding: 0 12px;
        font-size: 1em;
        background-color: #f8fafc;
        color: var(--text-dark);
        transition: all 0.2s ease;
      }

      .input-control:focus {
        background-color: #fff;
        border: 2px solid var(--primary-teal);
        outline: none;
      }

      /* 密碼眼睛 */
      .password-wrapper {
        position: relative;
      }

      .toggle-password {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-gray);
        font-size: 1.1em;
        cursor: pointer;
      }

      /* 記住我 */
      .remember-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.95em;
        color: var(--text-gray);
        margin: 24px 0;
        cursor: pointer;
        font-weight: 600;
      }

      .remember-wrapper input[type="checkbox"] {
        width: 1.1em;
        height: 1.1em;
        accent-color: var(--primary-teal);
      }

      /* 登入按鈕 */
      .submit-btn {
        width: 100%;
        height: 56px;
        background: var(--primary-teal);
        color: white;
        border: none;
        font-size: 1.15em;
        font-weight: 700;
        letter-spacing: 3px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .submit-btn:hover {
        background: var(--primary-active);
      }

      .submit-btn:active {
        transform: scale(0.98);
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="main-container" id="login-card">
      <!-- 選單控制區 -->
      <div class="controls-wrapper">
        <!-- 字體大小切換 -->
        <select class="select-style" onchange="changeFontSize(this.value)">
          <option value="16px">字體大小: 標準</option>
          <option value="18px">字體大小: 中</option>
          <option value="20px">字體大小: 大</option>
          <option value="22px">字體大小: 特大</option>
        </select>

        <!-- 語系切換 -->
        <select class="select-style" onchange="changeL(this.value)">
          <option value="zh">繁體中文</option>
          <option value="en">English</option>
          <option value="jp">日本語</option>
        </select>
      </div>

      <!-- Logo -->
      <div class="logo-box">
        <img src="/img/logo-2.png" alt="建豐健康科技" />
      </div>

      <div class="title-box">
        <h1 id="txt-h1">建豐AI動態骨架防跌檢測</h1>
      </div>

      <!-- 表單 -->
      <div class="form-group">
        <label id="lbl-u">帳號</label>
        <input
          type="text"
          id="ipt-u"
          class="input-control"
          placeholder="請輸入帳號"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label id="lbl-p">密碼</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="ipt-p"
            class="input-control"
            placeholder="請輸入密碼"
            autocomplete="current-password"
          />
          <span class="toggle-password" onclick="togglePassword()">
            <i id="eye-icon" class="fa-regular fa-eye-slash"></i>
          </span>
        </div>
      </div>

      <label class="remember-wrapper">
        <input type="checkbox" id="chk-rem" />
        <span id="txt-rem">記住帳號</span>
      </label>

      <button class="submit-btn" id="btn-login">登入</button>
    </div>

    <script>
      const langData = {
        zh: {
          h1: "建豐AI動態骨架防跌檢測",
          u: "帳號",
          uPh: "請輸入帳號",
          p: "密碼",
          pPh: "請輸入密碼",
          rem: "記住帳號密碼",
          btn: "登入",
        },
        en: {
          h1: "FongAI Skeleton Fall Detection",
          u: "Account",
          uPh: "Enter account",
          p: "Password",
          pPh: "Enter password",
          rem: "Remember Me",
          btn: "Login",
        },
        jp: {
          h1: "建豐AI動態骨格転倒検知",
          u: "アカウント",
          uPh: "IDを入力",
          p: "パスワード",
          pPh: "パスを入力",
          rem: "ログイン情報を保存",
          btn: "ログイン",
        },
      };

      function changeL(lang) {
        const d = langData[lang];
        document.getElementById("txt-h1").innerText = d.h1;
        document.getElementById("lbl-u").innerText = d.u;
        document.getElementById("ipt-u").placeholder = d.uPh;
        document.getElementById("lbl-p").innerText = d.p;
        document.getElementById("ipt-p").placeholder = d.pPh;
        document.getElementById("txt-rem").innerText = d.rem;
        document.getElementById("btn-login").innerText = d.btn;
      }

      // 變更字體大小：直接針對登入卡片容器進行縮放
      function changeFontSize(size) {
        const card = document.getElementById("login-card");
        card.style.fontSize = size;
      }

      function togglePassword() {
        const pwdInput = document.getElementById("ipt-p");
        const eyeIcon = document.getElementById("eye-icon");
        if (pwdInput.type === "password") {
          pwdInput.type = "text";
          eyeIcon.classList.replace("fa-eye-slash", "fa-eye");
        } else {
          pwdInput.type = "password";
          eyeIcon.classList.replace("fa-eye", "fa-eye-slash");
        }
      }
    </script>
  </body>
</html>
