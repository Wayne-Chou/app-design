<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>建豐AI - 動態骨架防跌檢測</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary-teal: #14b8a6;
        --text-light: #ffffff;
        --text-gray: #94a3b8;
        --input-bg: rgba(255, 255, 255, 0.05);
        --container-bg: rgba(15, 23, 42, 0.85); /* 深色半透明背景 */
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        border-radius: 0 !important; /* 強制移除所有圓角 */
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-image: url("/img/bac.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
      }

      .main-container {
        width: 100%;
        max-width: 400px;
        background: var(--container-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 50px 35px;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        border-top: 4px solid var(--primary-teal); /* 頂部色條增加識別度 */
      }

      .lang-wrapper {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 25px;
      }

      .lang-select {
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: transparent;
        color: var(--text-light);
        padding: 5px 10px;
        font-size: 13px;
        outline: none;
      }

      .lang-select option {
        background: #0f172a;
        color: white;
      }

      .logo-box {
        text-align: center;
        margin-bottom: 15px;
      }

      .logo-box img {
        width: 160px;
        filter: brightness(0) invert(1); /* 如果 Logo 是深色的，將其反白以配深色背景 */
      }

      .title-box {
        text-align: center;
        margin-bottom: 45px;
      }

      .title-box h1 {
        font-size: 20px;
        font-weight: 300; /* 使用細體增加高級感 */
        letter-spacing: 2px;
        color: var(--text-light);
        margin: 0;
      }

      .form-group {
        margin-bottom: 30px;
      }

      .form-group label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--primary-teal);
        margin-bottom: 10px;
        display: block;
      }

      .input-control {
        width: 100%;
        height: 50px;
        border: none;
        border-bottom: 2px solid rgba(255, 255, 255, 0.2); /* 只有底線 */
        background: transparent;
        padding: 0 5px;
        font-size: 16px;
        color: white;
        transition: all 0.3s ease;
      }

      .input-control:focus {
        border-bottom-color: var(--primary-teal);
        outline: none;
      }

      .input-control::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      .password-wrapper {
        position: relative;
      }

      .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
      }

      .remember-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--text-gray);
        margin: -10px 0 35px;
        cursor: pointer;
      }

      .remember-wrapper input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--primary-teal);
      }

      .submit-btn {
        width: 100%;
        height: 56px;
        background: var(--primary-teal);
        color: white;
        border: none;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 4px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .submit-btn:hover {
        background: #0d9488;
        box-shadow: 0 0 20px rgba(20, 184, 166, 0.4);
      }

      .status-footer {
        margin-top: 40px;
        text-align: center;
      }

      .status-text {
        font-size: 11px;
        color: var(--text-gray);
        letter-spacing: 1px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background-color: var(--primary-teal);
        animation: blink 2s infinite;
      }

      @keyframes blink {
        0% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.2;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="lang-wrapper">
        <select class="lang-select" onchange="changeL(this.value)">
          <option value="zh">繁體中文</option>
          <option value="en">English</option>
          <option value="jp">日本語</option>
        </select>
      </div>

      <div class="logo-box">
        <img src="/img/logo-2.png" alt="建豐健康科技" />
      </div>

      <div class="title-box">
        <h1 id="txt-h1">建豐AI動態骨架防跌檢測</h1>
      </div>

      <div class="form-group">
        <label id="lbl-u">帳號 User Account</label>
        <input
          type="text"
          id="ipt-u"
          class="input-control"
          placeholder="請輸入帳號"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label id="lbl-p">密碼 Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="ipt-p"
            class="input-control"
            placeholder="請輸入密碼"
            autocomplete="current-password"
          />
          <span class="toggle-password" onclick="togglePassword()">
            <i id="eye-icon" class="fa-regular fa-eye-slash"></i>
          </span>
        </div>
      </div>

      <label class="remember-wrapper">
        <input type="checkbox" id="chk-rem" />
        <span id="txt-rem">記住帳號密碼</span>
      </label>

      <button class="submit-btn" id="btn-login">LOGIN</button>

      <div class="status-footer">
        <div class="status-text">
          <div class="status-dot"></div>
          <span id="txt-s">AI SYSTEM ONLINE</span>
        </div>
      </div>
    </div>

    <script>
      // 原有 script 邏輯保持不變...
      const langData = {
        zh: {
          h1: "建豐AI動態骨架防跌檢測",
          u: "帳號 User Account",
          uPh: "請輸入帳號",
          p: "密碼 Password",
          pPh: "請輸入密碼",
          rem: "記住帳號密碼",
          btn: "LOGIN",
          s: "AI SYSTEM ONLINE",
        },
        en: {
          h1: "FongAI Skeleton Fall Detection",
          u: "Account",
          uPh: "Enter account",
          p: "Password",
          pPh: "Enter password",
          rem: "Remember Me",
          btn: "LOGIN",
          s: "AI SYSTEM ONLINE",
        },
        jp: {
          h1: "建豐AI動態骨格転倒検知",
          u: "アカウント",
          uPh: "IDを入力",
          p: "パスワード",
          pPh: "パスを入力",
          rem: "ログイン情報を保存",
          btn: "ログイン",
          s: "AI轉倒検知コア稼働中",
        },
      };

      function changeL(lang) {
        const d = langData[lang];
        document.getElementById("txt-h1").innerText = d.h1;
        document.getElementById("lbl-u").innerText = d.u;
        document.getElementById("ipt-u").placeholder = d.uPh;
        document.getElementById("lbl-p").innerText = d.p;
        document.getElementById("ipt-p").placeholder = d.pPh;
        document.getElementById("txt-rem").innerText = d.rem;
        document.getElementById("btn-login").innerText = d.btn;
        document.getElementById("txt-s").innerText = d.s;
      }

      function togglePassword() {
        const pwdInput = document.getElementById("ipt-p");
        const eyeIcon = document.getElementById("eye-icon");
        if (pwdInput.type === "password") {
          pwdInput.type = "text";
          eyeIcon.classList.replace("fa-eye-slash", "fa-eye");
        } else {
          pwdInput.type = "password";
          eyeIcon.classList.replace("fa-eye", "fa-eye-slash");
        }
      }
    </script>
  </body>
</html>
