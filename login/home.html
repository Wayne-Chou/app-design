<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>單位管理系統 - 核心版</title>
    <style>
      :root {
        --primary-teal: #0d9488;
        --accent-teal: #14b8a6;
        --bg-light: #f1f5f9;
        --text-dark: #0f172a;
        --text-gray: #64748b;
      }

      body {
        background-color: var(--bg-light);
        font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: var(--text-dark);
        margin: 0;
        padding-bottom: 40px;
      }

      /* 頂部導覽列 */
      .header {
        background-color: var(--primary-teal);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .logo-box img {
        width: 32px;
        height: 32px;
        background: white;
        padding: 4px;
        border-radius: 6px;
      }

      /* 主功能容器 */
      .main-focus-container {
        margin: 20px;
      }

      /* 超級主按鈕 */
      .main-focus-card {
        background: linear-gradient(
          135deg,
          var(--primary-teal),
          var(--accent-teal)
        );
        border-radius: 28px;
        padding: 30px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        border: none;
        width: 100%;
        box-shadow: 0 10px 25px rgba(13, 148, 136, 0.2);
        cursor: pointer;
        transition: transform 0.2s;
      }
      .main-focus-card:active {
        transform: scale(0.98);
      }

      .main-focus-card h1 {
        font-size: 26px;
        font-weight: 900;
        margin: 0;
      }
      .main-focus-card p {
        font-size: 14px;
        opacity: 0.8;
        margin: 5px 0 0;
      }
      .main-focus-card img {
        width: 60px;
        height: 60px;
        filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.1));
      }

      /* 快速鑑測入口 - 改為緊跟在後的膠囊設計 */
      .quick-action-area {
        margin-top: 12px;
      }
      .quick-btn {
        width: 100%;
        background: #ffffff;
        border: 2px solid var(--primary-teal);
        color: var(--primary-teal);
        border-radius: 16px;
        padding: 14px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      .quick-btn i {
        color: #f59e0b;
      }

      /* 四格快捷區 */
      .grid-shortcuts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 10px 20px;
        gap: 12px;
      }
      .shortcut-item {
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .shortcut-icon {
        width: 58px;
        height: 58px;
        background: white;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: var(--primary-teal);
        margin-bottom: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      }
      .shortcut-label {
        font-size: 11px;
        font-weight: 700;
        color: #475569;
      }

      /* 下方模組列表 */
      .menu-section {
        margin: 25px 20px;
      }
      .section-title {
        font-size: 14px;
        font-weight: 800;
        color: var(--text-gray);
        margin-bottom: 12px;
      }

      .function-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .function-card {
        background: white;
        padding: 16px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .function-card i {
        font-size: 18px;
        color: var(--primary-teal);
        width: 20px;
      }
      .function-card span {
        font-size: 14px;
        font-weight: 600;
      }

      .design-preview-btn {
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: #334155;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 50px;
        font-size: 11px;
        z-index: 2000;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo-box"><img src="../img/logo.png" alt="Logo" /></div>
      <div class="greeting">單位名稱顯示</div>
    </div>

    <div class="main-focus-container">
      <button class="main-focus-card main-feature">
        <div>
          <h1>開始鑑測</h1>
          <p>Standard Assessment</p>
        </div>
        <img src="../img/22.png" alt="" />
      </button>

      <div class="quick-action-area">
        <button class="quick-btn" id="fastTestBtn">
          <i class="fa-solid fa-bolt-lightning"></i>
          <span>快速鑑測</span>
        </button>
      </div>
    </div>

    <div class="grid-shortcuts">
      <button class="shortcut-item">
        <div class="shortcut-icon"><i class="fa-solid fa-chart-line"></i></div>
        <div class="shortcut-label">鑑測報告</div>
      </button>
      <button class="shortcut-item">
        <div class="shortcut-icon"><i class="fa-solid fa-users-gear"></i></div>
        <div class="shortcut-label">受測管理</div>
      </button>
      <button class="shortcut-item">
        <div class="shortcut-icon">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <div class="shortcut-label">影像上傳</div>
      </button>
      <button class="shortcut-item">
        <div class="shortcut-icon">
          <i class="fa-solid fa-camera-rotate"></i>
        </div>
        <div class="shortcut-label">鏡頭校準</div>
      </button>
    </div>

    <div class="menu-section">
      <div class="section-title">健康與商城</div>
      <div class="function-grid">
        <div class="function-card">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>建豐嚴選</span>
        </div>
        <div class="function-card">
          <i class="fa-solid fa-heart-pulse"></i>
          <span>衛教分享</span>
        </div>
      </div>
    </div>

    <div class="menu-section">
      <div class="section-title">協助與支援</div>
      <div class="function-grid">
        <div class="function-card">
          <i class="fa-solid fa-circle-question"></i>
          <span>操作說明</span>
        </div>
        <div class="function-card">
          <i class="fa-solid fa-gear"></i>
          <span>系統設定</span>
        </div>
      </div>
    </div>

    <div class="modal fade" id="groupTestModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px; border: none">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold">選擇場域</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-4">
            <div class="d-flex flex-column gap-2">
              <button
                class="btn btn-light py-3 border-0 fw-bold"
                style="background: #f1f5f9; border-radius: 12px"
                data-field="A"
              >
                場域 A
              </button>
              <button
                class="btn btn-light py-3 border-0 fw-bold"
                style="background: #f1f5f9; border-radius: 12px"
                data-field="B"
              >
                場域 B
              </button>
              <button
                class="btn btn-light py-3 border-0 fw-bold"
                style="background: #f1f5f9; border-radius: 12px"
                data-field="C"
              >
                場域 C
              </button>
              <button
                class="btn btn-light py-3 border-0 fw-bold"
                style="background: #f1f5f9; border-radius: 12px"
                data-field="D"
              >
                場域 D
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const groupBtn = document.querySelector(".main-feature");
      const groupModal = new bootstrap.Modal(
        document.getElementById("groupTestModal"),
      );

      // 1. 標準鑑測 (彈出 Modal)
      groupBtn.addEventListener("click", () => groupModal.show());

      // 2. 快速鑑測 (直接動作)
      document.getElementById("fastTestBtn").addEventListener("click", () => {
        alert("正在進入快速鑑測流程...");
      });

      // 場域選擇邏輯
      document.querySelectorAll("#groupTestModal .btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          console.log("選擇場域:", e.currentTarget.dataset.field);
          groupModal.hide();
        });
      });
    </script>
  </body>
</html>
