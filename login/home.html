<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <title>單位管理系統 - 核心版</title>
    <style>
      :root {
        --primary-teal: #0d9488;
        --accent-teal: #14b8a6;
        --deep-teal: #0f766e;
        --soft-teal: #ccfbf1;
        --bg-light: #f1f5f9;
        --text-dark: #0f172a;
        --text-gray: #64748b;
      }

      body {
        background-color: var(--bg-light);
        font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        color: var(--text-dark);
        margin: 0;
        padding-bottom: 40px;
      }

      /* 頂部導覽列 */
      .header {
        background-color: var(--primary-teal);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        position: sticky;
        top: 0;
        z-index: 1000;
      }
      .logo-box img {
        width: 32px;
        height: 32px;
        background: white;
        padding: 4px;
        border-radius: 6px;
      }

      /* 主功能：只有一顆開始鑑測 */
      .main-focus-container {
        margin: 20px;
      }
      .main-focus-card {
        background: linear-gradient(
          135deg,
          var(--primary-teal),
          var(--accent-teal)
        );
        border-radius: 28px;
        padding: 30px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: white;
        border: none;
        width: 100%;
        text-align: left;
        box-shadow: 0 10px 25px rgba(13, 148, 136, 0.2);
        cursor: pointer;
        transition: transform 0.2s;
      }
      .main-focus-card:active {
        transform: scale(0.98);
      }
      .main-focus-card h1 {
        font-size: 26px;
        font-weight: 900;
        margin: 0;
      }
      .main-focus-card p {
        font-size: 14px;
        opacity: 0.85;
        margin: 5px 0 0;
      }
      .main-focus-card img {
        width: 60px;
        height: 60px;
        filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.1));
      }

      /* 四格快捷區 */
      .grid-shortcuts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 10px 20px;
        gap: 12px;
      }
      .shortcut-item {
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .shortcut-icon {
        width: 58px;
        height: 58px;
        background: white;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: var(--primary-teal);
        margin-bottom: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      }
      .shortcut-label {
        font-size: 11px;
        font-weight: 700;
        color: #475569;
      }

      /* 下方模組列表 */
      .menu-section {
        margin: 25px 20px;
      }
      .section-title {
        font-size: 14px;
        font-weight: 800;
        color: var(--text-gray);
        margin-bottom: 12px;
      }
      .function-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .function-card {
        background: white;
        padding: 16px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .function-card i {
        font-size: 18px;
        color: var(--primary-teal);
        width: 20px;
      }
      .function-card span {
        font-size: 14px;
        font-weight: 600;
      }

      /* ===== 選擇測驗彈窗 ===== */
      .modal-backdrop.show {
        opacity: 0.45;
      }
      .test-modal .modal-dialog {
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
        padding: 0 20px;
      }
      .test-modal .modal-content {
        border: none;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.25);
      }

      /* 彈窗頂部：延續主按鈕的漸層 */
      .test-modal .modal-top {
        background: linear-gradient(
          135deg,
          var(--primary-teal),
          var(--accent-teal)
        );
        color: white;
        padding: 24px 24px 22px;
        position: relative;
      }
      .test-modal .modal-top h5 {
        margin: 0;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 0.5px;
      }
      .test-modal .modal-top p {
        margin: 4px 0 0;
        font-size: 13px;
        opacity: 0.85;
      }
      .test-modal .close-btn {
        position: absolute;
        top: 18px;
        right: 18px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .test-modal .close-btn:active {
        background: rgba(255, 255, 255, 0.35);
      }

      .test-modal .modal-body {
        padding: 18px 18px 20px;
        background: #f8fafc;
      }

      /* 測驗選項 */
      .test-item {
        width: 100%;
        background: white;
        border: 2px solid #e2e8f0;
        border-radius: 18px;
        padding: 16px 16px 16px 18px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 14px;
        text-align: left;
        color: var(--text-dark);
        transition:
          border-color 0.15s,
          background 0.15s,
          transform 0.15s;
      }
      .test-item:last-child {
        margin-bottom: 0;
      }
      .test-item .t-no {
        font-size: 13px;
        font-weight: 900;
        color: var(--primary-teal);
        background: var(--soft-teal);
        width: 36px;
        height: 36px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
        transition: all 0.15s;
      }
      .test-item .t-name {
        flex: 1;
        min-width: 0;
        font-size: 17px;
        font-weight: 800;
      }
      .test-item .t-arrow {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--bg-light);
        color: #94a3b8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        flex-shrink: 0;
        transition: all 0.15s;
      }

      /* 按下／選取時 */
      .test-item:hover,
      .test-item:focus-visible {
        border-color: var(--accent-teal);
        outline: none;
      }
      .test-item:active,
      .test-item.selected {
        border-color: var(--primary-teal);
        background: #f0fdfa;
        transform: scale(0.98);
      }
      .test-item:active .t-no,
      .test-item.selected .t-no {
        background: var(--primary-teal);
        color: white;
      }
      .test-item:active .t-arrow,
      .test-item.selected .t-arrow {
        background: var(--primary-teal);
        color: white;
      }

      /* 提示訊息 */
      .toast-box {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%) translateY(20px);
        background: #0f172a;
        color: white;
        padding: 12px 18px;
        border-radius: 14px;
        font-size: 14px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: all 0.25s;
        z-index: 3000;
        white-space: nowrap;
      }
      .toast-box.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo-box"><img src="../img/logo.png" alt="Logo" /></div>
      <div class="greeting">單位名稱顯示</div>
    </div>

    <!-- 唯一的測驗入口，測驗再多這裡都不用改 -->
    <div class="main-focus-container">
      <button class="main-focus-card" id="startBtn">
        <div>
          <h1>開始鑑測</h1>
        </div>
        <img src="../img/22.png" alt="" />
      </button>
    </div>

    <div class="grid-shortcuts">
      <button class="shortcut-item">
        <div class="shortcut-icon"><i class="fa-solid fa-chart-line"></i></div>
        <div class="shortcut-label">鑑測報告</div>
      </button>
      <button class="shortcut-item">
        <div class="shortcut-icon"><i class="fa-solid fa-users-gear"></i></div>
        <div class="shortcut-label">受測管理</div>
      </button>
      <button class="shortcut-item">
        <div class="shortcut-icon">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <div class="shortcut-label">影像上傳</div>
      </button>
      <button class="shortcut-item">
        <div class="shortcut-icon">
          <i class="fa-solid fa-camera-rotate"></i>
        </div>
        <div class="shortcut-label">鏡頭校準</div>
      </button>
    </div>

    <div class="menu-section">
      <div class="section-title">健康與商城</div>
      <div class="function-grid">
        <div class="function-card">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>建豐嚴選</span>
        </div>
        <div class="function-card">
          <i class="fa-solid fa-heart-pulse"></i>
          <span>衛教分享</span>
        </div>
      </div>
    </div>

    <div class="menu-section">
      <div class="section-title">協助與支援</div>
      <div class="function-grid">
        <div class="function-card">
          <i class="fa-solid fa-circle-question"></i>
          <span>操作說明</span>
        </div>
        <div class="function-card">
          <i class="fa-solid fa-gear"></i>
          <span>系統設定</span>
        </div>
      </div>
    </div>

    <!-- 選擇測驗彈窗 -->
    <div
      class="modal fade test-modal"
      id="testModal"
      tabindex="-1"
      aria-labelledby="testModalTitle"
    >
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-top">
            <h5 id="testModalTitle">選擇測驗項目</h5>

            <button
              type="button"
              class="close-btn"
              data-bs-dismiss="modal"
              aria-label="關閉"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="modal-body">
            <div id="testList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-box" id="toastBox"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      /* =========================================================
       * 設定區：新增測驗只要在這裡加一筆，介面不用動
       * ========================================================= */
      const TESTS = [
        { id: "sppb", name: "SPPB" },
        { id: "gait", name: "行走測驗" },
        // 範例：之後新增測驗，複製一段加在這裡即可
        // { id: "grip", name: "握力測驗" },
      ];

      /* ===== 程式邏輯 ===== */
      const testModal = new bootstrap.Modal(
        document.getElementById("testModal"),
      );
      const testList = document.getElementById("testList");
      const toastBox = document.getElementById("toastBox");

      function renderTests() {
        testList.innerHTML = TESTS.map(
          (t, i) => `
          <button class="test-item" data-test-id="${t.id}">
            <span class="t-no">${String(i + 1).padStart(2, "0")}</span>
            <span class="t-name">${t.name}</span>
            <span class="t-arrow"><i class="fa-solid fa-chevron-right"></i></span>
          </button>`,
        ).join("");
      }

      // 選好測驗後要做的事（之後接場域選擇或換頁就改這裡）
      function onTestSelected(test) {
        console.log("選擇測驗:", test.id);
        showToast(`已選擇：${test.name}`);
      }

      let toastTimer;
      function showToast(msg) {
        toastBox.textContent = msg;
        toastBox.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastBox.classList.remove("show"), 2000);
      }

      document.getElementById("startBtn").addEventListener("click", () => {
        testList
          .querySelectorAll(".selected")
          .forEach((el) => el.classList.remove("selected"));
        testModal.show();
      });

      testList.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-test-id]");
        if (!btn) return;
        const test = TESTS.find((t) => t.id === btn.dataset.testId);
        // 先顯示選取狀態，再關閉彈窗，讓使用者看到自己點了哪個
        btn.classList.add("selected");
        setTimeout(() => {
          testModal.hide();
          onTestSelected(test);
        }, 180);
      });

      renderTests();
    </script>
  </body>
</html>
